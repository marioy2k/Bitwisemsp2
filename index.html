<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bitwise MSP - Live Support</title>

  <link rel="icon" href="images/fevicon.png" type="image/gif" />

  <link rel="stylesheet" type="text/css" href="css/bootstrap.css" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link href="css/font-awesome.min.css" rel="stylesheet" />
  <link href="css/style.css" rel="stylesheet" />
  <link href="css/responsive.css" rel="stylesheet" />
</head>

<body>

<div class="hero_area">

  <!-- Clean Header -->
  <header class="header_section">
    <div class="container-fluid">
      <nav class="navbar navbar-expand-lg custom_nav-container">
        <a class="navbar-brand" href="#">
          <span>Bitwise MSP</span>
        </a>

        <div class="ml-auto">
          <a href="tel:+5977238113" style="color:white;">
            <i class="fa fa-phone"></i>
            Call: +597 723-8113
          </a>
        </div>
      </nav>
    </div>
  </header>

  <!-- Hero Section -->
  <section class="slider_section">
    <div class="container">
      <div class="row align-items-center" style="min-height:70vh;">
        <div class="col-md-6">
          <div class="detail-box">
            <h1>Live IT Support</h1>
            <p>
              Need immediate assistance? Our support team is ready to help you.
              Start a live chat or call us directly.
            </p>
            <div class="btn-box">
              <a href="tel:+5977238113" class="btn-1">
                Call Now
              </a>
              <a href="#" class="btn-2" onclick="openChat()">
                Start Live Chat
              </a>
            </div>
          </div>
        </div>

        <div class="col-md-6 text-center">
          <img src="images/slider-img.png" alt="" style="max-width:100%;">
        </div>
      </div>
    </div>
  </section>

</div>

<!-- Contact Section -->
<section class="contact_section layout_padding-bottom">
  <div class="container">
    <div class="heading_container heading_center">
      <h2>Send Us a Message</h2>
    </div>
    <div class="row">
      <div class="col-md-8 col-lg-6 mx-auto">
        <div class="form_container">
          <form action="https://formspree.io/f/xnnanplv" method="POST">
            <div>
              <input type="text" name="name" placeholder="Your Name" required />
            </div>
            <div>
              <input type="email" name="email" placeholder="Your Email" required />
            </div>
            <div>
              <input type="text" name="phone" placeholder="Your Phone" />
            </div>
            <div>
              <input type="text" name="message" class="message-box" placeholder="Message" required />
            </div>
            <div class="btn_box">
              <button type="submit">SEND</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- Footer -->
<footer class="footer_section">
  <div class="container text-center">
    <p>
      &copy; 2026 Bitwise MSP | South America | Suriname | Paramaribo
    </p>
  </div>
</footer>

<!-- Scripts -->
<script src="js/jquery-3.4.1.min.js"></script>
<script src="js/bootstrap.js"></script>
<script src="js/custom.js"></script>

<script>
function openChat() {
  document.querySelector('.zammad-chat').click();
}
</script>

<!-- Zammad Chat Widget -->
<script src="https://support.bitwisesr.com/assets/chat/chat-no-jquery.min.js"></script>
<script>
(function() {
  new ZammadChat({
    fontSize: '12px',
    chatId: 1
  });
})();
</script>

</body>
</html>
