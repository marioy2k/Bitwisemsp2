<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Koers | Bitwise MSP</title><style>
body{margin:0;background:#f4f6f9;color:#17243a;font-family:Arial,sans-serif}main{max-width:600px;margin:60px auto;padding:30px;background:white;border-radius:12px;box-shadow:0 4px 20px #0001}h1{margin-top:0}.rate{font-size:36px;font-weight:bold;color:#087c9c}dl{display:grid;grid-template-columns:1fr 1fr;gap:18px}dd{margin:0;text-align:right}button{padding:12px 20px;background:#17243a;color:white;border:0;border-radius:6px;cursor:pointer}#status{line-height:1.6;color:#475569}@media(max-width:650px){main{margin:20px;padding:24px}.rate{font-size:30px}}
</style></head><body><main><h1>USD / SRD koers</h1><p>Bitwise MSP shopkoers</p><p id="shop" class="rate">Laden…</p><dl><dt>Laatst opgehaald</dt><dd id="updated">—</dd></dl><p id="status" role="status" aria-live="polite">Koers wordt elk uur automatisch opgehaald.</p><button id="refresh">Vernieuwen</button></main><script>
(function(){
var button=document.getElementById('refresh');
var money=function(n){return n.toLocaleString('nl-NL',{minimumFractionDigits:2,maximumFractionDigits:2});};
async function load(){
button.disabled=true;document.getElementById('status').textContent='Koers ophalen…';
var controller=new AbortController(),timer=setTimeout(function(){controller.abort();},10000);
try{
var response=await fetch('https://raw.githubusercontent.com/marioy2k/Bitwisemsp2/main/data/cme-rate.json?t='+Date.now(),{cache:'no-store',signal:controller.signal});
if(!response.ok)throw Error();
var r=await response.json(),age=Date.now()-Date.parse(r.fetched_at),sourceAge=Date.now()-Date.parse(r.source_date+'T00:00:00Z');
if(!Number.isFinite(r.base_rate)||r.base_rate<1||r.base_rate>1000||r.markup_srd_per_usd!==1.25||Math.abs(r.shop_rate-r.base_rate-1.25)>0.000001||!Number.isFinite(age)||age< -300000||!Number.isFinite(sourceAge))throw Error();

document.getElementById('shop').textContent='1 USD = SRD '+money(r.shop_rate);

document.getElementById('updated').textContent=new Date(r.fetched_at).toLocaleString('nl-NL',{timeZone:'America/Paramaribo'})+' (Suriname)';
document.getElementById('status').textContent=age>10800000||sourceAge>345600000?'Let op: deze koers is verouderd. De shop vraagt om bevestiging van het SRD-bedrag.':'Actuele koers. Automatische update elk uur. Vernieuwen leest de laatst opgeslagen koers.';
}catch(e){document.getElementById('shop').textContent='Koers niet beschikbaar';document.getElementById('updated').textContent='—';document.getElementById('status').textContent='Ophalen mislukt. Probeer later opnieuw.';}finally{clearTimeout(timer);button.disabled=false;}
}
button.addEventListener('click',load);load();setInterval(load,300000);
})();
</script></body></html>
