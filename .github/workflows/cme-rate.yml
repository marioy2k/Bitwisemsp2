name: Update CME exchange rate
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/update_cme_rate.py'
      - '.github/workflows/cme-rate.yml'
permissions:
  contents: write
concurrency:
  group: cme-rate-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Fetch and validate CME selling rate
        run: python3 scripts/update_cme_rate.py
      - name: Save current rate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cme-rate.json
          if ! git diff --cached --quiet; then
            git commit -m "Update CME exchange rate"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
